name: shiguang
description: 拾光 — 拾起散落的光阴
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  hive: ^2.2.3
  path_provider: ^2.1.5
  http: ^1.2.2
  share_plus: ^10.0.4
  photo_manager: ^3.3.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.8
  image_picker: ^1.1.2
  health: ^12.2.0
  exif: ^3.3.0
  google_mlkit_image_labeling: 0.14.1
  # 端侧 AI：llama.cpp 的 Dart 绑定（纯 FFI + isolate，无平台通道）。
  # 锁 0.2.2：更新版本要求 Dart ^3.10，本项目是 3.4.4。
  llama_cpp_dart: 0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

# llama_cpp_dart 0.2.2 → typed_isolate 6.0.0 要 meta ^1.15.0，
# Flutter 3.22.3 把 meta 钉在 1.12.0。meta 是纯 Dart 注解/常量包，
# override 到 1.15.0 无原生代码差异，属社区通用解法（升级 Flutter 后可移除）。
# ffi 2.1.4 相比 2.1.3 零 API 变化（仅因 tall style 格式化把 SDK 门槛抬到 3.7），
# override 到 2.1.3 即可兼容 Dart 3.4.4。
dependency_overrides:
  meta: 1.15.0
  ffi: 2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/hero-memories.jpg
    - assets/film-index/
